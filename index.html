<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>10 Questions Every Couple Should Ask</title>

  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary-color: #ff4b72;
      --secondary-color: #ff85a2;
      --accent-color: #4a90e2;
      --bg-gradient: linear-gradient(135deg, #fce4ec 0%, #ffe0b2 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
      padding: 20px 10px;
    }

    .page {
      display: none;
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      animation: fadeIn 0.4s ease-out forwards;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      background: #fff0f3;
      color: var(--primary-color);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      border: 1px solid var(--secondary-color);
    }

    h1, h2 {
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    p {
      margin-bottom: 18px;
      line-height: 1.6;
      font-size: 1.02rem;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }

    .quiz-btn {
      background: white;
      border: 2px solid var(--secondary-color);
      color: #333;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .quiz-btn:hover {
      background: var(--secondary-color);
      color: white;
      transform: translateY(-1px);
    }

    .btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn:hover {
      background: #e03a5f;
      transform: translateY(-2px);
    }

    /* Explanation Box */
    .answer-box {
      background: #fdf2f4;
      padding: 20px;
      border-radius: 15px;
      border-left: 5px solid var(--primary-color);
      margin: 20px 0;
      text-align: left;
    }

    .answer-box h3 {
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    /* Modal / Popup */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.55);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      max-width: 360px;
      width: 88%;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-emoji {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      background: #eee;
      height: 8px;
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary-color);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- POPUP MODAL FOR FUNNY ANALOGIES -->
  <div id="popup-modal" class="modal-overlay">
    <div class="modal-content">
      <div id="modal-emoji" class="modal-emoji">🤪</div>
      <p id="modal-text" style="font-weight: 500; margin-bottom: 15px;">Funny response here...</p>
      <button class="btn" style="padding: 6px 22px; font-size: 0.9rem;" onclick="closeModal()">Try Again / Understood!</button>
    </div>
  </div>

  <!-- CONTAINER FOR DYNAMICALLY GENERATED PAGES -->
  <div id="quiz-container"></div>

  <script>
    // 10 RELATIONSHIP QUESTIONS WITH CORRECT ANSWERS, EXPLANATIONS, AND FUNNY ANALOGIES
    const quizData = [
      {
        q: "1. How do we best handle conflict when we disagree?",
        options: [
          { text: "A) Silent treatment for 3 business days", analogy: "Ah yes, silent treatment... like ignoring a check-engine light until your entire car explodes on the highway! 🚗💥", correct: false },
          { text: "B) Screaming till someone wins the debate championship", analogy: "Yelling isn't communication; it's just aggressive vocal warmup for a musical nobody bought tickets to. 🎭🔊", correct: false },
          { text: "C) Talk calmly, attack the problem (not each other), and take breaks if heated", analogy: "", correct: true },
          { text: "D) Pretend nothing happened and sweep it under the rug", analogy: "Keep sweeping under that rug and eventually you'll trip over a mountain of unaddressed resentment! 🧹⛰️", correct: false }
        ],
        insight: "Correct answer: Option C! Healthy couples don't avoid conflict; they learn how to disagree without tearing each other down."
      },
      {
        q: "2. What are our financial goals and spending habits?",
        options: [
          { text: "A) Buy whatever we want and hope card reader says 'APPROVED'", analogy: "Swiping blind is like driving blindfolded—it's super fun until the collision statement arrives! 💳🙈", correct: false },
          { text: "B) Openly discuss budget, savings, debt, and shared expenses", analogy: "", correct: true },
          { text: "C) One person handles all money and hides bank statements", analogy: "Financial secrecy is like playing Monopoly where one player hides the board under their shirt. 🎩💸", correct: false },
          { text: "D) Never talk about money because it's awkward", analogy: "Ignoring money talk doesn't make bills vanish—it just guarantees a surprise plot twist later! 🎟️📉", correct: false }
        ],
        insight: "Correct answer: Option B! Money issues are one of the leading causes of relationship strain. Transparency builds long-term trust."
      },
      {
        q: "3. What are our non-negotiables regarding future family & kids?",
        options: [
          { text: "A) Align on whether we want kids, timing, and parenting values", analogy: "", correct: true },
          { text: "B) Assume the other person will change their mind later", analogy: "Hoping someone will radically change their life dream is like buying a cat and expecting it to bark! 🐱🐶", correct: false },
          { text: "C) Let our relatives decide our entire family timeline", analogy: "If you let relatives run your household, you're not in a relationship; you're in a family sitcom! 📺🛋️", correct: false },
          { text: "D) Avoid the topic until we're at the altar", analogy: "Waiting until marriage to discuss kids is like checking if a plane has wings after takeoff! ✈️💨", correct: false }
        ],
        insight: "Correct answer: Option A! Having mismatched fundamental life goals creates unnecessary heartache down the road."
      },
      {
        q: "4. How do we divide household responsibilities and chores?",
        options: [
          { text: "A) Whoever gets annoyed by mess first does all the work", analogy: "That's not a partnership; that's a psychological game of dirty-dish chicken! 🧽🐔", correct: false },
          { text: "B) One person cooks, cleans, and manages everything while the other naps", analogy: "Unless you signed up to be an unpaid hotel maid, this contract needs immediate revision! 🏨🧹", correct: false },
          { text: "C) Create a fair, clear division of labor based on schedules", analogy: "", correct: true },
          { text: "D) Leave laundry in the basket until it gains sentience", analogy: "When your laundry pile starts asking for its own coffee, you've waited way too long! 🧺☕", correct: false }
        ],
        insight: "Correct answer: Option C! Shared effort in domestic life prevents burnout and resentment."
      },
      {
        q: "5. What are our expectations around personal space and independent time?",
        options: [
          { text: "A) We must do every single activity together 24/7", analogy: "Glueing yourselves together sounds romantic until someone needs 10 minutes of peace and quiet! 👯‍♂️🔒", correct: false },
          { text: "B) Balance quality time together with space for individual hobbies & friends", analogy: "", correct: true },
          { text: "C) Never check in or share plans with each other", analogy: "Total detachment isn't freedom—it's just living with a roommate who eats your leftovers! 🍕👻", correct: false },
          { text: "D) Get jealous whenever the other hangs out with friends", analogy: "Jealousy of outside friendships is like locking a bird in a cage and expecting it to sing happy songs! 🦜🗝️", correct: false }
        ],
        insight: "Correct answer: Option B! Healthy relationships consist of two distinct individuals who complement each other, not swallow each other whole."
      },
      {
        q: "6. How do we show and receive love (Love Languages)?",
        options: [
          { text: "A) Assume my partner loves things the exact same way I do", analogy: "Giving someone gifts when they want quality time is like giving a dog an apple—nice try, wrong target! 🐶🍎", correct: false },
          { text: "B) Expect my partner to read my mind without telling them", analogy: "Expecting mind-reading is like ordering in a restaurant by staring silently at the waiter! 🍽️🔮", correct: false },
          { text: "C) Learn each other's primary love language and actively practice it", analogy: "", correct: true },
          { text: "D) Love language is just marketing; ignore emotional needs", analogy: "Dismissing emotional needs is like refusing to put oil in your car because 'oil is just a marketing trick.' 🏎️🛢️", correct: false }
        ],
        insight: "Correct answer: Option C! Understanding how your partner feels valued keeps emotional connection strong over time."
      },
      {
        q: "7. How will we handle boundaries with extended family & in-laws?",
        options: [
          { text: "A) Stand as a united front and set clear, respectful boundaries together", analogy: "", correct: true },
          { text: "B) Let parents make major decisions for our relationship", analogy: "Letting parents run your relationship means there are 4 people steering one steering wheel! 🚗💥", correct: false },
          { text: "C) Vent publicly to family every time we have a minor disagreement", analogy: "Venting relationship drama to family is like inviting a stadium audience to referee your bedroom talks! 🏟️📣", correct: false },
          { text: "D) Cut off all family completely without discussing why", analogy: "Ghosting family without reason is like dropping a smoke bomb and running out of your own living room! 💨🚪", correct: false }
        ],
        insight: "Correct answer: Option A! Your relationship priority must be each other while maintaining healthy boundaries with extended family."
      },
      {
        q: "8. What are our career ambitions and how do we support each other's growth?",
        options: [
          { text: "A) My career is the main priority; yours is optional", analogy: "Treating your partner's career as a side-quest is a fast track to resentment village! 🎮🚩", correct: false },
          { text: "B) Encourage each other's goals and plan relocations/sacrifices jointly", analogy: "", correct: true },
          { text: "C) Discourage ambitious goals because change feels scary", analogy: "Clipping your partner's wings so they don't fly away just leaves you both grounded in sadness! ✂️🕊️", correct: false },
          { text: "D) Never talk about work or professional dreams", analogy: "Ignoring career dreams is like pretending 40+ hours of your partner's week simply doesn't exist! ⏱️💼", correct: false }
        ],
        insight: "Correct answer: Option B! Great partners lift each other up and adapt together as careers evolve."
      },
      {
        q: "9. How do we keep physical and emotional intimacy alive over time?",
        options: [
          { text: "A) Expect romance to stay effortless without any deliberate work", analogy: "Expecting effortlessness in long-term romance is like expecting a garden to stay beautiful without water! 🥀🚿", correct: false },
          { text: "B) Communicate openly about intimacy, desires, and keep dating each other", analogy: "", correct: true },
          { text: "C) Stop going on dates once the relationship is official", analogy: "Stopping date nights after getting official is like cancelling your gym membership the second you hit your goal! 🏋️‍♂️🍟", correct: false },
          { text: "D) Rely strictly on physical passion and ignore emotional closeness", analogy: "Physical connection without emotional intimacy is like a high-speed car with no steering wheel! 🏎️⚠️", correct: false }
        ],
        insight: "Correct answer: Option B! Intimacy takes conscious effort, regular date nights, and open dialogue."
      },
      {
        q: "10. What are our core personal values, beliefs, and ethics?",
        options: [
          { text: "A) Discuss moral values, ethics, and life philosophy to ensure core alignment", analogy: "", correct: true },
          { text: "B) Values don't matter as long as we both like the same TV shows", analogy: "Bingeing the same Netflix series won't save you when life throws a major moral dilemma! 📺🌪️", correct: false },
          { text: "C) Force the other person to adopt 100% of my political/moral views", analogy: "Demanding total conformity isn't love; that's running a political re-education camp! ⛺📢", correct: false },
          { text: "D) Hope that major value differences will magically disappear", analogy: "Ignoring core value conflicts is like building a house on quicksand and hoping it stays level! 🏜️🏠", correct: false }
        ],
        insight: "Correct answer: Option A! Shared core values create the bedrock for a resilient, lifelong partnership."
      }
    ];

    // RENDER QUIZ PAGES DYNAMICALLY
    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      let html = '';

      // Welcome Page
      html += `
        <div id="page-0" class="page active">
          <span class="badge">Couples Relationship Guide</span>
          <h1>10 Questions Every Couple Should Ask 💖</h1>
          <p>Building a lasting relationship requires asking the right questions. Test your relationship IQ through these 10 core topics!</p>
          <p style="font-size:0.9rem; color:#666;">Choose the right answer for each question. Watch out for funny analogies if you pick the wrong ones! 😜</p>
          <button class="btn" onclick="goToPage(1)">Start Question 1 🚀</button>
        </div>
      `;

      // 10 Question Pages
      quizData.forEach((qData, index) => {
        const pageNum = index + 1;
        const progressPercent = (pageNum / quizData.length) * 100;

        html += `
          <div id="page-${pageNum}" class="page">
            <div class="progress-bar"><div class="progress-fill" style="width: ${progressPercent}%;"></div></div>
            <span class="badge">Question ${pageNum} of ${quizData.length}</span>
            <h2>${qData.q}</h2>
            <p style="color:#666; font-size:0.9rem;">Select the option you think is essential for a strong relationship:</p>

            <div class="quiz-options">
              ${qData.options.map((opt, optIdx) => `
                <button class="quiz-btn" onclick="handleOptionClick(${pageNum}, ${opt.correct}, '${escapeQuotes(opt.analogy)}')">
                  ${opt.text}
                </button>
              `).join('')}
            </div>

            <div id="insight-${pageNum}" class="answer-box" style="display:none;">
              <h3>Relationship Insight ✨</h3>
              <p style="margin-bottom:0;">${qData.insight}</p>
            </div>

            <button id="next-btn-${pageNum}" class="btn" style="display:none;" onclick="goToPage(${pageNum + 1})">
              ${pageNum === 10 ? 'Finish Quiz 🎉' : 'Next Question ➡️'}
            </button>
          </div>
        `;
      });

      // Completion Page
      html += `
        <div id="page-11" class="page">
          <span class="badge">Congratulations! 🏆</span>
          <h1>You Completed All 10 Questions! ❤️</h1>
          <p>Great relationships aren't built on finding a perfect person—they're built on open communication, mutual respect, and continuous alignment.</p>
          <div style="background:#fff0f3; padding:20px; border-radius:15px; border:2px dashed var(--primary-color); margin:20px 0;">
            <p style="font-weight:600; color:var(--primary-color); margin:0;">
              "The best time to ask big questions is before small differences turn into big obstacles." 💬✨
            </p>
          </div>
          <button class="btn" onclick="goToPage(0)">Restart Quiz 🔄</button>
        </div>
      `;

      container.innerHTML = html;
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function handleOptionClick(pageNum, isCorrect, analogy) {
      if (isCorrect) {
        // Correct Answer Selected
        document.getElementById(`insight-${pageNum}`).style.display = 'block';
        document.getElementById(`next-btn-${pageNum}`).style.display = 'inline-block';
        launchConfetti();
      } else {
        // Wrong Answer Selected - Show Funny Analogy
        showModal('🤪', analogy);
      }
    }

    function goToPage(pageNum) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      const targetPage = document.getElementById(`page-${pageNum}`);
      if (targetPage) {
        targetPage.classList.add('active');
      }
      window.scrollTo(0, 0);

      if (pageNum === 11) {
        launchConfetti();
      }
    }

    function showModal(emoji, text) {
      document.getElementById('modal-emoji').innerText = emoji;
      document.getElementById('modal-text').innerText = text;
      document.getElementById('popup-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('popup-modal').style.display = 'none';
    }

    function launchConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 60,
          spread: 60,
          origin: { y: 0.6 }
        });
      }
    }

    // Initialize Quiz on load
    document.addEventListener('DOMContentLoaded', renderQuiz);
  </script>
</body>
</html>
